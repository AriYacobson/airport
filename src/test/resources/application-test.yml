spring:
  datasource:
    url: jdbc:h2:mem:oligarch-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop

oligarch-rating:
  external:
    assets-valuation:
      base-url: http://localhost:0
      connect-timeout: 1s
      read-timeout: 1s
    oligarch-helper:
      base-url: http://localhost:0
      connect-timeout: 1s
      read-timeout: 1s

resilience4j:
  retry:
    instances:
      assets-valuation:
        max-attempts: 1
      oligarch-helper:
        max-attempts: 1

logging:
  level:
    com.example.oligarchrating: DEBUG
